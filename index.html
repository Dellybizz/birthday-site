<!doctype html>
<html lang="en">
<head>
<script id="birthday-freshness-guard">
(()=>{
  const root=document.documentElement;
  root.classList.add('birthday-freshness-check');
  const style=document.createElement('style');
  style.textContent='html.birthday-freshness-check body{visibility:hidden!important}';
  document.head.appendChild(style);
  let done=false;
  const reveal=()=>{if(done)return;done=true;root.classList.remove('birthday-freshness-check')};
  const params=new URLSearchParams(location.search);
  if(params.get('adminPreview')==='1'&&params.has('t')){reveal();return}
  const probe=new URL(location.href);
  probe.searchParams.set('_freshcheck',Date.now().toString());
  fetch(probe,{method:'HEAD',cache:'no-store'}).then(response=>{
    const remote=Date.parse(response.headers.get('last-modified')||'');
    const local=Date.parse(document.lastModified||'');
    if(Number.isFinite(remote)&&Number.isFinite(local)&&remote>local+500){
      const next=new URL(location.href);
      next.searchParams.delete('_freshcheck');
      next.searchParams.set('_build',String(remote));
      location.replace(next.href);
      return;
    }
    reveal();
  }).catch(reveal);
  setTimeout(reveal,2200);
})();
</script>

<meta name="viewport" content="width=device-width,initial-scale=1">
