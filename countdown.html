<script id="birthday-freshness-guard">
(()=>{
  const root=document.documentElement;
  root.classList.add('birthday-freshness-check');
  const style=document.createElement('style');
  style.textContent='html.birthday-freshness-check body{visibility:hidden!important}';
  document.head.appendChild(style);
  let done=false;
  const reveal=()=>{if(done)return;done=true;root.classList.remove('birthday-freshness-check')};
  const params=new URLSearchParams(location.search);
  if(params.get('adminPreview')==='1'&&params.has('t')){reveal();return}
  const probe=new URL(location.href);
  probe.searchParams.set('_freshcheck',Date.now().toString());
  fetch(probe,{method:'HEAD',cache:'no-store'}).then(response=>{
    const remote=Date.parse(response.headers.get('last-modified')||'');
    const local=Date.parse(document.lastModified||'');
    if(Number.isFinite(remote)&&Number.isFinite(local)&&remote>local+500){
      const next=new URL(location.href);
      next.searchParams.delete('_freshcheck');
      next.searchParams.set('_build',String(remote));
      location.replace(next.href);
      return;
    }
    reveal();
  }).catch(reveal);
  setTimeout(reveal,2200);
})();
</script>

  const near=diff>0&&diff<=180000;
  const mid=diff>0&&diff<=135000;
  const close=diff>0&&diff<=90000;
  const minute=diff>0&&diff<=60000;
  const fortyfive=diff>0&&diff<=45000;
  const twentyfive=diff>0&&diff<=25000;
  const ten=diff>0&&diff<=10000;
  const arrived=countdownIsAfter();
  const classes={
    'countdown-near':near,
    'countdown-mid':mid,
    'countdown-close':close,
    'countdown-minute':minute,
    'countdown-fortyfive':fortyfive,
    'countdown-twentyfive':twentyfive,
    'countdown-ten':ten
  };
  for(const [name,on] of Object.entries(classes))document.body.classList.toggle(name,on&&!arrived);
  document.body.classList.toggle('countdown-arrived',arrived);
  const progress=near?Math.max(0,Math.min(1,(180000-diff)/170000)):0;
  document.body.style.setProperty('--final-progress',String(progress));
  if(finalWhisper){
    if(arrived)finalWhisper.textContent='';
    else if(ten)finalWhisper.textContent='ten tiny seconds';
    else if(twentyfive)finalWhisper.textContent='just seconds now';
    else if(fortyfive)finalWhisper.textContent='forty-five seconds';
    else if(minute)finalWhisper.textContent='one minute';
    else if(close)finalWhisper.textContent='ninety seconds';
    else if(mid)finalWhisper.textContent='the room is changing';
    else if(near)finalWhisper.textContent='three minutes. stay here.';
    else finalWhisper.textContent='';
  }
  if(finalSecondNumber&&ten&&!arrived)finalSecondNumber.textContent=String(Math.max(1,Math.ceil(diff/1000)));
  if(arrived&&!celebrationStarted)startBirthdayCelebration();
}
function startBirthdayCelebration(){
  celebrationStarted=true;
  if(matchMedia?.('(prefers-reduced-motion: reduce)')?.matches)return;
  const count=26;
  for(let i=0;i<count;i++){
    const petal=document.createElement('i');
    petal.className='birthday-petal';
    petal.style.left=(3+Math.random()*94)+'vw';
    petal.style.top=(-10-Math.random()*26)+'vh';
    petal.style.setProperty('--drift',(-70+Math.random()*140)+'px');
    petal.style.animation='petalFall '+(5.8+Math.random()*4.8)+'s '+(Math.random()*3.2)+'s cubic-bezier(.2,.55,.35,1) forwards';
    petal.style.transform='scale('+(0.65+Math.random()*.9)+')';
    document.body.appendChild(petal);
    setTimeout(()=>petal.remove(),13000);
  }
}
function scheduleCountdown(){
  clearTimeout(countdownTimer);
  let diff=adminPreview&&previewMomentMs!==null?previewMomentMs:countdownTarget.getTime()-Date.now();
  if(countdownIsAfter()){
    diff=0;
    setCountdownPhase(diff);
    renderCountdownCopy();
    for(const el of Object.values(numberEls))el.textContent='00';
    return;
  }
  diff=Math.max(0,diff);
  setCountdownPhase(diff);
  renderCountdownCopy();
  numberEls.days.textContent=padCountdown(diff/86400000);
  numberEls.hours.textContent=padCountdown((diff%86400000)/3600000);
  numberEls.minutes.textContent=padCountdown((diff%3600000)/60000);
  numberEls.seconds.textContent=padCountdown((diff%60000)/1000);
  if(requestedView==='before'&&diff<=0)return;
  countdownTimer=setTimeout(scheduleCountdown,Math.max(120,Math.min(1000,Math.ceil(diff%1000)||1000)));
}
function applyCountdownState(next){
  if(next&&typeof next==='object'){
    countdownState={
      general:{...(next.general||countdownState.general||{})},
      pages:{...(next.pages||countdownState.pages||{})}
    };
  }
  const parsed=new Date(countdownState.general?.birthdayISO||'2026-09-20T00:00:00+05:30');
  countdownTarget=Number.isNaN(parsed.getTime())?new Date('2026-09-20T00:00:00+05:30'):parsed;
  scheduleCountdown();
  document.documentElement.classList.remove('countdown-booting');
}
window.COUNTDOWN_PAGE={
  applyState:applyCountdownState,
  isAfter:countdownIsAfter,
  getViewSettings:countdownViewSettings,
  getAccessSettings:countdownAccessSettings,
  previewPhase(name){
    if(!adminPreview)return;
    const fake={three:179000,two:119000,ninety:89000,minute:59000,thirty:30000,twenty:20000,ten:9000,zero:0}[name];
    if(fake===undefined)return;
    previewMomentMs=fake;
    scheduleCountdown();
  },
  requestedView
};
if(!adminPreview){
  const ready=window.BDAY?.ready||window.BDAY?.load?.();
  if(ready){
    Promise.resolve(ready)
      .then(result=>applyCountdownState(result?.state||window.BDAY?.read?.()||{}))
      .catch(()=>applyCountdownState(window.BDAY?.read?.()||{general:{...(window.SITE_CONFIG||{})},pages:window.SITE_CONFIG?.pages||{}}));
  }else applyCountdownState(window.BDAY?.read?.()||{general:{...(window.SITE_CONFIG||{})},pages:window.SITE_CONFIG?.pages||{}});
}else{
  // Control Room injects its current draft through COUNTDOWN_PAGE.applyState on iframe load.
  setTimeout(()=>{
    if(document.documentElement.classList.contains('countdown-booting')){
      applyCountdownState({general:{...(window.SITE_CONFIG||{})},pages:window.SITE_CONFIG?.pages||{}});
    }
  },1800);
}
</script>
