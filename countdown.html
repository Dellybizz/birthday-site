<script>(function(){
const SUPABASE_URL='https://aaimjubffhdujevrdamo.supabase.co';
const PUBLISHABLE_KEY='sb_publishable_y58fL0aRLE3wgV3nP5WIxQ_GE52Xaum';
const KEY='birthday-site-state-v2';
const DEFAULTS={
  general:{name:'HER NAME',nickname:'NICKNAME',insideJoke:'',introLine:'',birthdayISO:'2026-09-18T00:00:00+05:30',previewCountdownHours:24,favoritePhoto:'',musicFile:'',soundDefault:false,motionScale:1,globalCss:''},
  pageOrder:['countdown.html','index.html','memories.html','pretty-photos.html','heart.html','yapping.html','fair.html','finale.html'],
  pageEnabled:{'index.html':true,'memories.html':true,'pretty-photos.html':true,'heart.html':true,'yapping.html':true,'fair.html':true,'countdown.html':true,'finale.html':true},
  fairItems:{},fairPhotos:{},patches:{},pageCss:{},pages:{}
};
function clone(x){return JSON.parse(JSON.stringify(x))}
function merge(base,extra){
  if(Array.isArray(base)) return Array.isArray(extra)?clone(extra):clone(base);
  if(base&&typeof base==='object'){
    const out=clone(base);
    if(extra&&typeof extra==='object'&&!Array.isArray(extra)) for(const k of Object.keys(extra)) out[k]=(k in out)?merge(out[k],extra[k]):clone(extra[k]);
    return out;
  }
  return extra===undefined?base:extra;
}
function read(){try{return merge(DEFAULTS,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{return clone(DEFAULTS)}}
function write(v){localStorage.setItem(KEY,JSON.stringify(v));syncSiteConfig(v);return v}
function syncSiteConfig(state){
  const g=state.general||{};
  window.SITE_CONFIG={...(window.SITE_CONFIG||{}),...g,pages:state.pages||{},fairItems:state.fairItems||{},fairPhotos:state.fairPhotos||{},pageOrder:state.pageOrder||DEFAULTS.pageOrder,pageEnabled:state.pageEnabled||DEFAULTS.pageEnabled};
}
async function fetchRemote(){
  const r=await fetch(`${SUPABASE_URL}/rest/v1/site_state?id=eq.live&select=data,updated_at`,{headers:{apikey:PUBLISHABLE_KEY,Authorization:`Bearer ${PUBLISHABLE_KEY}`},cache:'no-store'});
  if(!r.ok) throw new Error('Could not load live settings');
  const rows=await r.json();
  const row=rows&&rows[0];
  if(!row) return {state:read(),updated_at:null};
  const st=merge(DEFAULTS,row.data||{}); write(st); return {state:st,updated_at:row.updated_at};
}
async function publish(state,adminKey){
  const r=await fetch(`${SUPABASE_URL}/functions/v1/birthday-site-admin`,{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':adminKey},body:JSON.stringify({action:'publish',data:state})});
  const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.error||'Publish failed'); write(state); return j;
}
async function ping(adminKey){
  const r=await fetch(`${SUPABASE_URL}/functions/v1/birthday-site-admin`,{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':adminKey},body:JSON.stringify({action:'ping'})});
  return r.ok;
}
async function upload(file,adminKey,folder='uploads'){
  const fd=new FormData();fd.append('file',file);fd.append('folder',folder);
  const r=await fetch(`${SUPABASE_URL}/functions/v1/birthday-site-media`,{method:'POST',headers:{'x-admin-key':adminKey},body:fd});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Upload failed');return j;
}
const initial=read();syncSiteConfig(initial);
window.BDAY={key:KEY,defaults:DEFAULTS,read,write,fetchRemote,publish,ping,upload,supabaseUrl:SUPABASE_URL,publishableKey:PUBLISHABLE_KEY};
})();
</script>

<script>
const cfg=window.SITE_CONFIG||{};const stage=document.getElementById('stage'),next=document.getElementById('next'),preview=document.getElementById('preview');let previewMode=false;let target;
if(cfg.birthdayISO){const parsed=new Date(cfg.birthdayISO);if(!isNaN(parsed))target=parsed}
if(!target){previewMode=true;target=new Date(Date.now()+(Number(cfg.previewCountdownHours)||24)*3600000);preview.textContent='preview mode · set birthdayISO in config.js';next.classList.add('show')}
function pad(n){return String(Math.max(0,Math.floor(n))).padStart(2,'0')}
function tick(){let diff=target-Date.now();if(diff<=0&&!previewMode){stage.classList.add('arrived');document.getElementById('eyebrow').textContent='it is officially time';document.getElementById('title').innerHTML='happy birthday,<br><em>'+(cfg.nickname||'NICKNAME')+'.</em>';document.getElementById('sub').textContent='The waiting part is over. There is one last thing I made for you.';preview.textContent='';next.classList.add('show');return}diff=Math.max(0,diff);const d=diff/86400000,h=(diff%86400000)/3600000,m=(diff%3600000)/60000,s=(diff%60000)/1000;document.getElementById('days').textContent=pad(d);document.getElementById('hours').textContent=pad(h);document.getElementById('minutes').textContent=pad(m);document.getElementById('seconds').textContent=pad(s);requestAnimationFrame(()=>setTimeout(tick,250))}tick();
let audio=document.createElement('audio');audio.src='';audio.loop=true;audio.preload='metadata';audio.style.display='none';document.body.appendChild(audio);document.getElementById('soundBtn').onclick=async()=>{if(audio.paused){try{await audio.play();sessionStorage.setItem('birthdayMusic','on');document.getElementById('soundBtn').textContent='sound on'}catch(e){document.getElementById('soundBtn').textContent='choose soundtrack'}}else{audio.pause();sessionStorage.setItem('birthdayMusic','off');document.getElementById('soundBtn').textContent='sound'}};
</script>
<script>(async function(){
const B=window.BDAY;if(!B)return;
const rawPage=location.pathname.split('/').pop()||'index.html';const page=rawPage==='entry.html'?'index.html':rawPage;
let state=B.read();
function apply(st){
  state=st;B.write(st);
  const css=[st.general?.globalCss||'',st.pageCss?.[page]||''].filter(Boolean).join('\n');
  if(css){let s=document.getElementById('birthday-runtime-css');if(!s){s=document.createElement('style');s.id='birthday-runtime-css';document.head.appendChild(s)}s.textContent=css}
  // Visual overrides are applied only by page-patch-runtime.js.
  document.documentElement.style.setProperty('--motion-scale',String(st.general?.motionScale??1));
  if(st.general?.motionScale===0) document.documentElement.classList.add('reduce-birthday-motion');
  // Journey gating and disabled-page routing are handled by journey-runtime.js.
}
apply(state);
try{
  const remote=await B.fetchRemote();
  const before=JSON.stringify(state),after=JSON.stringify(remote.state);
  if(before!==after){
    const stamp=remote.updated_at||after.length;const sk='birthday-live-version-'+page;
    if(sessionStorage.getItem(sk)!==stamp){sessionStorage.setItem(sk,stamp);location.reload();return}
  }
  apply(remote.state);
}catch(e){console.warn('Birthday site live settings unavailable; using cached settings.',e)}
})();
</script>

<script>
(async()=>{
  const PASSWORD='200905';
  const preview=new URLSearchParams(location.search).get('adminPreview')==='1';
  let cfg=window.SITE_CONFIG||{};
  try{if(window.BDAY?.fetchRemote){const r=await window.BDAY.fetchRemote();cfg={...cfg,...(r.state?.general||{})}}}catch(e){}
  const fallback='2026-09-18T00:00:00+05:30';
  const parsed=new Date(cfg.birthdayISO||fallback);
  const target=isNaN(parsed)?new Date(fallback):parsed;
  const sub=document.getElementById('sub');
  const chapter=document.querySelector('.chapter');
  const inner=document.querySelector('.inner');
  if(chapter)chapter.textContent='birthday lock · first screen';
  const oldPreview=document.getElementById('preview');if(oldPreview)oldPreview.textContent='';
  const oldNext=document.getElementById('next');if(oldNext)oldNext.remove();
  const wrap=document.createElement('div');wrap.className='bday-lock-wrap';
  wrap.innerHTML='<button class="bday-lock" id="birthdayLock" type="button" aria-label="Birthday lock" disabled><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="10" y="21" width="28" height="20" rx="6"></rect><path d="M16 21v-7a8 8 0 0 1 16 0v7"></path><circle cx="24" cy="31" r="2.2"></circle></svg></button><div class="bday-lock-label" id="lockLabel">locked until her birthday</div><div class="bday-lock-note" id="lockNote">The timer is the key. When it reaches zero, the lock can finally be opened.</div>';
  inner?.appendChild(wrap);
  const modal=document.createElement('div');modal.className='lock-modal';modal.id='lockModal';
  modal.innerHTML='<div class="lock-card"><small>birthday access</small><h2>come on! you know the password</h2><p>Six digits. You definitely know this one.</p><input class="lock-code" id="lockCode" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="••••••" aria-label="Six digit password"><div class="lock-actions"><button type="button" id="lockCancel">not yet</button><button class="go" type="button" id="lockGo">unlock</button></div><p class="lock-error" id="lockError"></p></div>';
  document.body.appendChild(modal);
  const button=document.getElementById('birthdayLock'),label=document.getElementById('lockLabel'),note=document.getElementById('lockNote'),code=document.getElementById('lockCode'),error=document.getElementById('lockError');
  function ready(){return preview||Date.now()>=target.getTime()}
  function sync(){
    const isReady=ready();button.disabled=!isReady;button.classList.toggle('ready',isReady);
    label.textContent=isReady?'unlock':'locked until her birthday';
    note.textContent=isReady?'The wait is over. One tiny password check and the rest is yours.':'The timer is the key. When it reaches zero, the lock can finally be opened.';
    if(isReady&&sub)sub.textContent='The countdown is over. The lock is ready.';
  }
  sync();setInterval(sync,500);
  button.addEventListener('click',()=>{if(!ready())return;modal.classList.add('open');code.value='';error.textContent='';setTimeout(()=>code.focus(),50)});
  document.getElementById('lockCancel').addEventListener('click',()=>modal.classList.remove('open'));
  modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('open')});
  function submit(){
    const v=code.value.replace(/D/g,'').slice(0,6);code.value=v;
    if(v===PASSWORD){localStorage.setItem('birthdayUnlocked','1');localStorage.setItem('birthdayUnlockedAt',new Date().toISOString());location.replace('entry.html');return}
    error.textContent='come on! you know the password';
    code.animate([{transform:'translateX(0)'},{transform:'translateX(-7px)'},{transform:'translateX(7px)'},{transform:'translateX(0)'}],{duration:260});
    code.select();
  }
  code.addEventListener('input',()=>{code.value=code.value.replace(/D/g,'').slice(0,6);error.textContent=''});
  code.addEventListener('keydown',e=>{if(e.key==='Enter')submit()});
  document.getElementById('lockGo').addEventListener('click',submit);
})();
</script>
